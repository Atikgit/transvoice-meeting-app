# Production stack for a single host (Hetzner): Next.js app behind Caddy (automatic HTTPS).
#   cp .env.example .env.production   # fill in, plus DOMAIN and ACME_EMAIL
#   docker compose --env-file .env.production up -d --build
# Supabase, LiveKit Cloud and the TransVoice API stay external; nothing is stored on local disk
# except Caddy's certificates.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
    image: transvoice-meeting-app:latest
    env_file: .env.production
    restart: unless-stopped
    expose:
      - '3000'

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
